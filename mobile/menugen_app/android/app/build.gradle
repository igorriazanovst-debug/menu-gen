plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// MG_RELEASE: реквизиты подписи релиза.
//
// Локально — android/key.properties (в .gitignore). В CI файла нет, значения
// приходят переменными окружения из секретов. Ключ в репозиторий не попадает
// никогда: потеря или утечка keystore означает потерю возможности выпускать
// обновления — сменить подпись у опубликованного приложения нельзя.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

def signingValue = { String key, String envName ->
    keystoreProperties.getProperty(key) ?: System.getenv(envName)
}
def releaseStorePath = signingValue("storeFile", "MENUGEN_KEYSTORE_PATH")
def hasReleaseSigning = releaseStorePath != null && file(releaseStorePath).exists()

android {
    namespace = "ru.menugen.app"
    // MG_APPICON/SDK35 → MG_16KB: компилируемся против SDK 36.
    //
    // Это влияет только на то, какие API доступны при сборке; targetSdk (то
    // есть поведение в рантайме) сознательно оставлен на 34 — переход на 35
    // включает принудительный edge-to-edge на Android 15 и требует отдельной
    // проверки вёрстки. Для публикации в Google Play targetSdk придётся
    // поднять до 35, это отдельная задача.
    //
    // 36, а не 35: mobile_scanner 6.0.11 тянет CameraX 1.5.0, а тот собран
    // против 36 и требует того же от всех, кто им пользуется.
    compileSdk = 36
    // MG_16KB: NDK 27 задан явно, а не взят из Flutter SDK.
    //
    // Flutter 3.27.4 даёт NDK 26, и на каждой сборке шестнадцать плагинов
    // просили 27 — предупреждение висело в логе и его перестали замечать.
    // Важнее другое: r27 первым выравнивает под 16 КБ то, что собирается из
    // исходников. На готовые библиотеки внутри пакетов это не влияет — их
    // лечит только обновление самих пакетов (см. pubspec).
    //
    // buildToolsVersion не фиксируем — AGP подберёт совместимую сам
    // (пин 33.0.1 конфликтовал с compileSdk 35).
    ndkVersion = "27.0.12077973"

    // MG_STOREPERM: магазинная сборка идёт без REQUEST_INSTALL_PACKAGES.
    //
    // Разрешение нужно только сборке с сайта — она умеет обновлять себя и
    // обязана иметь право попросить установщик. Магазинам такое право не
    // нравится: RuStore отклонил за него 1.0.2.
    //
    // Почему так, а не иначе:
    //
    //   * не флавором — APK и AAB идут из одного release-варианта и различаются
    //     только форматом; отдельное измерение сборки потребовало бы --flavor от
    //     каждого локального запуска и от отладочной сборки в CI;
    //   * не плейсхолдером в tools:node — пробовали, AGP подстановку в атрибуты
    //     tools: не делает и падает с «No enum constant
    //     NodeOperationType.${...}» прямо на слиянии манифеста;
    //   * не вторым манифестом в репозитории — два почти одинаковых файла
    //     разъедутся, и заметит это опять модерация.
    //
    // Поэтому магазинный манифест ВЫВОДИТСЯ из основного: строка с разрешением
    // выбрасывается, остальное берётся как есть. Разъезжаться нечему.
    //
    // Свойство передаётся окружением, потому что flutter build не пробрасывает
    // -P в Gradle:  ORG_GRADLE_PROJECT_menugenStoreBuild=true flutter build appbundle
    if (project.hasProperty("menugenStoreBuild")) {
        def source = file("src/main/AndroidManifest.xml")
        def stripped = source.readLines().findAll { !it.contains("REQUEST_INSTALL_PACKAGES") }
        // Молча собрать манифест с разрешением — ровно тот случай, ради которого
        // всё это и делается. Лучше не собраться совсем.
        if (stripped.size() == source.readLines().size()) {
            throw new GradleException(
                "MG_STOREPERM: в AndroidManifest.xml не найдена строка с REQUEST_INSTALL_PACKAGES. " +
                "Если элемент разбили на несколько строк — верните его в одну."
            )
        }
        def generated = new File(project.buildDir, "menugen/store/AndroidManifest.xml")
        generated.parentFile.mkdirs()
        generated.text = stripped.join("\n") + "\n"
        sourceSets.main.manifest.srcFile generated
        println "MG_STOREPERM: магазинный манифест без REQUEST_INSTALL_PACKAGES — ${generated}"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // MG_WEIGHREMIND: flutter_local_notifications планирует показ через
        // java.time, а он появился только в API 26. Наш minSdk ниже (23), поэтому
        // без десугаринга сборка падает — это требование самого плагина, не наша
        // прихоть.
        coreLibraryDesugaringEnabled = true
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // MG_RELEASE: идентификатор приложения в магазинах. Меняется один раз и
        // навсегда: у опубликованного приложения его сменить нельзя — это будет
        // другое приложение, без обновлений для уже установивших.
        applicationId = "ru.menugen.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        //
        // MG_16KB: 23, а не 21 — приложение больше не ставится на Android 5.0 и 5.1.
        //
        // CameraX 1.5.0 приходит транзитивно с mobile_scanner 6.0.11 и объявляет
        // minSdk 23; слияние манифестов падало с «uses-sdk:minSdkVersion 21 cannot
        // be smaller than version 23». Обойти это можно только tools:overrideLibrary,
        // а он, по прямому предупреждению AGP, ведёт к падениям в рантайме — то
        // есть камера ломалась бы уже у пользователя.
        //
        // Решение принято осознанно: Android 5.x сегодня — доли процента устройств,
        // и планка всё равно поднимается дальше (mobile_scanner 7 требует Flutter
        // 3.29+). Ради 16 КБ, без которых Google Play не примет targetSdk 35.
        minSdk = 23
        // MG_SDK36: 36, потому что иначе Google Play не примет загрузку.
        //
        // С 31 августа 2026 новые приложения и обновления обязаны быть собраны
        // под Android 16 (API 36). Это проверка на приёме бандла, а не
        // замечание модератора: сборка с targetSdk 34 просто не загрузится.
        //
        // Что это включает (проверено по behavior-changes-16, а не по памяти):
        //
        //   * принудительный edge-to-edge, и отключить его больше нечем —
        //     windowOptOutEdgeToEdgeEnforcement на Android 16 не работает;
        //   * предиктивный «назад» по умолчанию, onBackPressed больше не
        //     вызывается (см. enableOnBackInvokedCallback в манифесте);
        //   * на экранах от 600dp игнорируются ограничения ориентации и
        //     размера — нас не касается, мы их не задаём.
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        // Подпись под иконкой. Задаётся здесь, а не в манифесте, чтобы
        // отладочная сборка могла назваться иначе (см. buildTypes.debug).
        resValue "string", "app_name", "MenuGen"

        // MG_STOREPERM: см. ниже, в sourceSets.
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseStorePath)
                storePassword = signingValue("storePassword", "MENUGEN_KEYSTORE_PASSWORD")
                keyAlias = signingValue("keyAlias", "MENUGEN_KEY_ALIAS")
                keyPassword = signingValue("keyPassword", "MENUGEN_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Без реквизитов подписи собираем отладочным ключом — иначе
            // `flutter run --release` перестал бы работать на машине разработчика.
            // В магазин такая сборка не годится, и CI это проверяет отдельно
            // (см. .github/workflows/android_release.yml).
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug

            // Сжатие кода (minifyEnabled/R8) намеренно не включено: оно ломается
            // только в релизе и только в рантайме, а проверить это можно лишь на
            // устройстве. Включать — отдельным шагом, после того как обычная
            // релизная сборка проверена целиком.
        }

        // MG_DEVBUILD: отладочная сборка — отдельное приложение.
        //
        // Идентификатор тот же, что у магазинной, означал бы «то же самое
        // приложение»: Android отказался бы ставить её поверх (подписи разные),
        // а поставить рядом было бы нечем. Проверять дев-сервер, снося при этом
        // рабочее приложение с его данными, — плохая цена за проверку.
        debug {
            applicationIdSuffix = ".dev"
            versionNameSuffix = "-dev"
            resValue "string", "app_name", "MenuGen dev"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // MG_WEIGHREMIND: см. coreLibraryDesugaringEnabled выше.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.3"
}
