pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // MG_APPICON/SDK35: плагины Flutter (url_launcher_android, image_picker_android
    // и др.) требуют compileSdk 35, а AGP 8.3.2 выше 34 не поддерживает —
    // сборка падала на checkDebugAarMetadata. AGP 8.7.3 требует Gradle 8.9
    // (см. gradle/wrapper/gradle-wrapper.properties).
    id "com.android.application" version "8.7.3" apply false
    id "org.jetbrains.kotlin.android" version "1.9.25" apply false
}

include ":app"
