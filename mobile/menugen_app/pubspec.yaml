name: menugen_app
description: Personalized meal planning app

publish_to: "none"
# Версия для магазина. Номер сборки (после «+») в релизном workflow
# перебивается номером прогона (--build-number), поэтому здесь он лишь
# значение по умолчанию для локальных сборок.
version: 1.0.4+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:

  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Network
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Local DB (Offline-First)
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Auth & Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Navigation
  go_router: ^13.2.1
  printing: ^5.12.0
  pdf: ^3.10.8

  # Connectivity
  connectivity_plus: ^6.0.3

  # UI
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1 # офлайн-кэш фото рецептов (кастомный менеджер)
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  # MG_WEIGHREMIND: местные уведомления (ежедневное напоминание взвеситься).
  # timezone нужен самому плагину: он планирует показ по TZDateTime.
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  table_calendar: ^3.1.1

  # Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0 # MG_PAY: открытие платёжной страницы YooKassa
  # MG_SELFUPDATE: своя версия и то, кто установил приложение (магазин или файл),
  # плюс передача скачанного apk системному установщику.
  package_info_plus: ^8.0.0
  open_filex: ^4.4.0
  collection: ^1.18.0
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.10
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700


dependency_overrides:
  sqlite3_flutter_libs: 0.5.20
