name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter_ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter_ci.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL (override default)'
        required: false
        default: 'https://menugen.ru/api/v1'

env:
  # pubspec.lock ХРАНИТСЯ в репозитории (см. .gitignore) и фиксирует набор
  # версий пакетов. Раньше здесь было написано обратное — и это была неправда,
  # из-за которой лок годами никто не обновлял: он отстал и фиксировал не то,
  # что собиралось (D-10).
  #
  # Версия SDK всё равно закреплена: без лока pub подбирал свежие версии, а тем
  # требуется SDK новее — на 3.22 сборка падала ещё на `flutter pub get` («Try
  # using the Flutter SDK version: 3.44.x»). 3.27.4 — версия, на которой
  # зависимости резолвятся и тесты проходят. Ограничение сверху:
  # flutter_localizations в 3.29+ тянет intl 0.20, а pubspec закреплён на
  # intl ^0.19.
  FLUTTER_VERSION: '3.27.4'
  DEFAULT_API_BASE_URL: 'https://menugen.ru/api/v1'

jobs:
  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlite3
        # Списки пакетов, которые нам не нужны, отключаем до обновления.
        #
        # На образе раннера прописан репозиторий Google Chrome, и 9 сентября он
        # начал отдавать индекс, не сходящийся с подписью в Release («Hash Sum
        # mismatch»). apt-get update выходит с кодом 100 — и сборка падала на
        # установке sqlite3, ни разу не дойдя до Flutter. Своей вины в этом нет
        # и починить на нашей стороне нельзя, а Chrome для тестов не нужен:
        # проще не спрашивать про него вовсе.
        #
        # Именно удаление списка, а не `|| true` на всю команду: молчаливое
        # игнорирование ошибок apt однажды скроет настоящую — недоступный
        # ubuntu-архив, из которого sqlite3 и ставится.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev sqlite3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: mobile/menugen_app

      # D-10: лок обязан совпадать с тем, что разрешает pub.
      #
      # Лежащий в репозитории лок молча отстал: в нём был mobile_scanner 5.2.3,
      # когда собирался 6.0.11, и вовсе не было flutter_local_notifications. То
      # есть он не делал свою работу — фиксировал не то, что собирается, — и
      # заметить это было негде: `flutter pub get` просто переписывает лок у
      # себя и идёт дальше.
      #
      # Проверка ловит оба случая: и забытое обновление лока после правки
      # pubspec.yaml, и «поплывшие» версии. Чинится одной командой на машине с
      # Flutter: flutter pub get, затем закоммитить pubspec.lock.
      - name: Проверить, что pubspec.lock не разошёлся
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            echo "::error::pubspec.lock разошёлся с тем, что разрешает pub. Выполните flutter pub get и закоммитьте лок."
            git --no-pager diff --stat -- pubspec.lock
            exit 1
          fi
          echo "pubspec.lock актуален."
        working-directory: mobile/menugen_app

      - name: Run tests
        run: flutter test --coverage
        working-directory: mobile/menugen_app

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: flutter-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Resolve API_BASE_URL
        id: api
        run: |
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then URL="${{ env.DEFAULT_API_BASE_URL }}"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Using API_BASE_URL=$URL"

      - name: Install dependencies
        run: flutter pub get
        working-directory: mobile/menugen_app

      - name: Build debug APK
        env:
          API_BASE_URL: ${{ steps.api.outputs.url }}
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --build-number=${{ github.run_number }}
        working-directory: mobile/menugen_app

      - name: Rename APK with build number + commit
        run: |
          SRC=mobile/menugen_app/build/app/outputs/flutter-apk/app-debug.apk
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DEST=mobile/menugen_app/build/app/outputs/flutter-apk/menugen-debug-${{ github.run_number }}-$SHORT_SHA.apk
          cp "$SRC" "$DEST"
          echo "ARTIFACT_PATH=$DEST" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: menugen-debug-apk-${{ github.run_number }}
          path: mobile/menugen_app/build/app/outputs/flutter-apk/menugen-debug-*.apk
          retention-days: 14
          if-no-files-found: error
