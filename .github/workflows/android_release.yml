# MG_RELEASE: подписанная сборка для магазинов (первый — RuStore).
#
# Отдельно от flutter_ci.yml намеренно: тот собирает отладочный APK на каждый
# push, а этот запускается руками, требует секретов с ключом подписи и делает
# то, что нельзя переделать после публикации.
#
# Ключ подписи в репозитории не лежит и лежать не может. Он приходит секретом
# ANDROID_KEYSTORE_BASE64 и восстанавливается в файл только на время сборки.
name: Android Release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Адрес API (по умолчанию прод)'
        required: false
        default: 'https://menugen.ru/api/v1'
      build_name:
        description: 'Версия для магазина, например 1.0.0 (пусто — из pubspec.yaml)'
        required: false
        default: ''
      artifact:
        description: 'Что собрать'
        required: true
        default: 'apk+aab'
        type: choice
        options: ['apk+aab', 'apk', 'aab']

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  build:
    name: Signed release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/menugen_app

    steps:
      - uses: actions/checkout@v4

      # Проверка ДО сборки: собранный не с тем адресом релиз внешне не отличим
      # от рабочего, а обнаружится это уже у пользователей магазина.
      - name: Проверить адрес API
        run: |
          URL="${{ github.event.inputs.api_base_url }}"
          [ -n "$URL" ] || URL="https://menugen.ru/api/v1"
          echo "API_BASE_URL=$URL" >> "$GITHUB_ENV"
          case "$URL" in
            https://*) ;;
            *) echo "::error::Магазинная сборка требует https, получено: $URL"; exit 1 ;;
          esac
          case "$URL" in
            *localhost*|*127.0.0.1*|*10.0.2.2*|*192.168.*)
              echo "::error::Локальный адрес в магазинной сборке: $URL"; exit 1 ;;
          esac
          echo "Собираем против $URL"

      # Проверяем все четыре сразу: без ключа Gradle подписал бы отладочным, а
      # без паролей упал бы с «Keystore was tampered with, or password was
      # incorrect» — сообщение, по которому причину не угадать.
      - name: Проверить секреты подписи
        run: |
          MISSING=""
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]   || MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ]         || MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]      || MISSING="$MISSING ANDROID_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Не заданы секреты:$MISSING (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Пароль проверяем до сборки: иначе ошибка вылезет через несколько минут,
      # в середине Gradle, и будет выглядеть как поломка сборки.
      - name: Проверить, что ключ открывается паролем
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/check.jks" 2>/dev/null || {
            echo "::error::ANDROID_KEYSTORE_BASE64 не разбирается — строка скопирована не целиком?"; exit 1; }
          if ! keytool -list -keystore "$RUNNER_TEMP/check.jks" \
                -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
                -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >/dev/null 2>&1; then
            echo "::error::Ключ не открылся: неверный пароль хранилища или алиас (ANDROID_KEY_ALIAS)."
            rm -f "$RUNNER_TEMP/check.jks"; exit 1
          fi
          rm -f "$RUNNER_TEMP/check.jks"
          echo "Ключ и пароль в порядке."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Восстановить keystore из секрета
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/menugen.jks"
          # Путь и пароли build.gradle читает из переменных окружения,
          # когда android/key.properties отсутствует (в CI его и нет).
          echo "MENUGEN_KEYSTORE_PATH=$RUNNER_TEMP/menugen.jks" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Тесты
        run: flutter test

      - name: Собрать APK
        if: ${{ github.event.inputs.artifact != 'aab' }}
        env:
          MENUGEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MENUGEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MENUGEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # MG_SELFUPDATE: apk раздаётся с сайта, поэтому умеет обновлять себя
          # сам. В aab для магазина этого флага нет — магазины запрещают
          # обновление мимо себя, и кода апдейтера там не должно быть вовсе.
          ARGS="--release --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=SELF_UPDATE=true --build-number=${{ github.run_number }}"
          if [ -n "${{ github.event.inputs.build_name }}" ]; then
            ARGS="$ARGS --build-name=${{ github.event.inputs.build_name }}"
          fi
          flutter build apk $ARGS

      - name: Собрать AAB
        if: ${{ github.event.inputs.artifact != 'apk' }}
        env:
          MENUGEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MENUGEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MENUGEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # MG_SELFUPDATE: без флага самообновления — это сборка для магазина.
          #
          # MG_STOREPERM: и без разрешения REQUEST_INSTALL_PACKAGES. Раньше флаг
          # убирал только КОД апдейтера, а разрешение оставалось в манифесте —
          # за него RuStore и отклонил 1.0.2. Свойство идёт окружением, потому
          # что flutter build не пробрасывает -P в Gradle.
          export ORG_GRADLE_PROJECT_menugenStoreBuild=true
          ARGS="--release --dart-define=API_BASE_URL=$API_BASE_URL --build-number=${{ github.run_number }}"
          if [ -n "${{ github.event.inputs.build_name }}" ]; then
            ARGS="$ARGS --build-name=${{ github.event.inputs.build_name }}"
          fi
          flutter build appbundle $ARGS

      # Отладочным ключом подписывается сборка без реквизитов — снаружи она
      # выглядит нормальным релизом, а магазин отвергнет её уже при загрузке.
      - name: Убедиться, что подпись не отладочная
        if: ${{ github.event.inputs.artifact != 'aab' }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OWNER=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -i "Signer #1 certificate DN" || true)
          echo "$OWNER"
          if echo "$OWNER" | grep -qi "CN=Android Debug"; then
            echo "::error::APK подписан отладочным ключом — магазин такую сборку не примет."
            exit 1
          fi

      # MG_STOREPERM: проверка идёт ДО выкладки артефактов, потому что цена
      # ошибки — не красная сборка, а отказ модерации и потерянные дни. Ровно
      # так и вышло с 1.0.2: разрешение уехало в магазин незамеченным.
      #
      # Проверяются обе стороны. Лишнее разрешение в AAB — отказ магазина.
      # Пропавшее из APK — молча сломанное самообновление на сайте: приложение
      # скачает файл и упрётся в установщик, и заметит это уже пользователь.
      - name: Проверить разрешение на установку пакетов
        run: |
          PERM=android.permission.REQUEST_INSTALL_PACKAGES
          AAB=build/app/outputs/bundle/release/app-release.aab
          APK=build/app/outputs/flutter-apk/app-release.apk

          if [ -f "$AAB" ]; then
            # Манифест внутри aab лежит в protobuf, но имена разрешений хранятся
            # в нём строками — grep по бинарному потоку их находит.
            if unzip -p "$AAB" base/manifest/AndroidManifest.xml | grep -aq "$PERM"; then
              echo "::error::В AAB осталось $PERM — магазин отклонит сборку."
              exit 1
            fi
            echo "AAB: разрешения нет, как и требуется."
          fi

          if [ -f "$APK" ]; then
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            if ! "$BUILD_TOOLS/aapt2" dump permissions "$APK" | grep -q "$PERM"; then
              echo "::error::В APK нет $PERM — самообновление с сайта работать не будет."
              exit 1
            fi
            echo "APK: разрешение на месте, самообновление работоспособно."
          fi

      # MG_16KB: готовность к 16-килобайтным страницам памяти.
      #
      # Google Play требует их поддержки от приложений с targetSdk 35+. У нас
      # пока 34, поэтому шаг ПОКА не валит сборку. Когда перейдём на 35,
      # отсутствие выравнивания должно ронять сборку так же, как лишнее
      # разрешение.
      #
      # Что показал первый прогон (сборка 9): движок Flutter выровнен —
      # libflutter.so и libapp.so идут с 0x10000. Не были выровнены три чужие
      # библиотеки, по 0x1000: libbarhopper_v3 (сканер ML Kit),
      # libimage_processing_util_jni (CameraX) и libsqlite3. Все три приходят
      # готовыми внутри пакетов, поэтому вылечились обновлением пакетов, а не
      # версией Flutter и не нашим NDK (см. pubspec.yaml, метки MG_16KB).
      #
      # Выравнивание — свойство библиотек, которыми собран движок и плагины, и
      # от targetSdk не зависит: мерить можно на нынешней сборке.
      #
      # Считаем ТОЛЬКО 64-разрядные ABI. Требование Google Play дословно:
      # «all apps targeting Android 15 (API level 35) and higher must support
      # 16 KB memory page sizes on 64-bit devices»
      # (developer.android.com/guide/practices/page-sizes). Страниц по 16 КБ на
      # 32-разрядных ядрах не бывает вовсе, поэтому armeabi-v7a и x86 в проверку
      # не входят — иначе она вечно горела бы на том, чего чинить не нужно.
      # Их выравнивание всё равно печатаем, но отдельной строкой и без вывода.
      - name: Проверить выравнивание нативных библиотек (16 КБ)
        if: ${{ github.event.inputs.artifact != 'apk' }}
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then echo "AAB не собирался — пропускаем."; exit 0; fi
          work=$(mktemp -d)
          unzip -q -o "$AAB" 'base/lib/*' -d "$work"
          total=0; bad=0; total32=0; bad32=0
          for so in $(find "$work" -name '*.so' | sort); do
            rel=${so#$work/}
            case "$rel" in
              */arm64-v8a/*|*/x86_64/*) bits=64 ;;
              *) bits=32 ;;
            esac
            aligns=$(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }' | sort -u | tr '\n' ' ')
            ok=1
            for a in $aligns; do
              if [ $((a)) -lt 16384 ]; then ok=0; fi
            done
            if [ "$bits" = 64 ]; then
              total=$((total + 1))
              if [ "$ok" -eq 1 ]; then
                echo "  ok   $rel  ($aligns)"
              else
                echo "  МАЛО $rel  ($aligns)"
                bad=$((bad + 1))
              fi
            else
              total32=$((total32 + 1))
              [ "$ok" -eq 1 ] || bad32=$((bad32 + 1))
              echo "  --   $rel  ($aligns)  32 бита, требование не распространяется"
            fi
          done
          echo "64-разрядных библиотек: $total, не выровнено под 16 КБ: $bad"
          echo "32-разрядных библиотек: $total32 (из них по 4 КБ: $bad32) — вне требования"
          if [ "$bad" -gt 0 ]; then
            # Пока предупреждение, а не падение: targetSdk у нас 34, и запрет
            # Google Play на такие сборки начинается с 35. В тот день, когда
            # targetSdk поднимут до 35, заменить эту строку на `exit 1`.
            echo "::warning::$bad из $total 64-разрядных библиотек не выровнены под 16 КБ — Google Play с targetSdk 35 такую сборку не примет. Лечится обновлением пакетов, которые приносят эти библиотеки готовыми (проверено: движок Flutter уже выровнен, дело не в нём)."
          else
            echo "Все 64-разрядные библиотеки готовы к 16 КБ — targetSdk 35 с этой стороны не блокирован."
          fi

      - name: Переименовать артефакты
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NAME="menugen-release-${{ github.run_number }}-$SHORT_SHA"
          mkdir -p artifacts
          # if, а не «[ -f ] && cp»: при сборке только одного формата вторая
          # проверка вернула бы ненулевой код и уронила шаг целиком.
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "artifacts/$NAME.apk"
          fi
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "artifacts/$NAME.aab"
          fi
          ls -lh artifacts

      - name: Выложить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: menugen-release-${{ github.run_number }}
          path: mobile/menugen_app/artifacts/*
          retention-days: 30

      - name: Удалить keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/menugen.jks"
