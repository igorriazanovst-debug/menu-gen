  <title>MenuGen Platform</title>
  <!-- MG_FAVICON: фирменный знак. Исходник — экспорт CorelDRAW; кривые взяты без
       изменений, но заменены две вещи:
       1) viewBox — в оригинале рисунок лежал за пределами артборда A4
          (21000x29700) в отрицательных координатах и не отображался;
       2) цвета перенесены из CSS-классов (.fil0/.str0/... в блоке стилей) в
          атрибуты фигур: flutter_svg таблицы стилей не поддерживает и рисовал
          знак сплошным чёрным. Атрибуты одинаково понимают браузер и приложение.
       ВАЖНО: при повторном экспорте из CorelDRAW классы вернутся — цвета снова
       придётся разложить по атрибутам (сторожит тест logo_asset_test.dart).
       Растровые иконки собираются отсюда:
         сайт:     web/menugen-web/scripts/make_icons.py
         Android:  mobile/menugen_app/scripts/make_app_icons.py -->
