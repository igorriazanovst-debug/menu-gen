# MenuGen — nginx для НОВОГО сервера (menugen.ru, один домен, HTTPS).
# TLS-сертификат выпускает certbot (--nginx). Backend (docker) слушает только
# 127.0.0.1:8003 — наружу его отдаёт этот прокси. Веб-фронт (CRA build) лежит в
# /opt/menugen/web-dist. Медиа и статика Django — из docker volume, смонтированного
# на хост, либо проксируются в backend (см. ниже — по умолчанию проксируем).
#
# Установка на сервере:
#   cp deploy/nginx/menugen.ru.conf /etc/nginx/sites-available/menugen.ru.conf
#   ln -sf /etc/nginx/sites-available/menugen.ru.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d menugen.ru -d www.menugen.ru   # выпустит cert и допишет ssl-строки
#
# После certbot строки ssl_certificate/… появятся автоматически. Ниже —
# базовая HTTP-версия; при первом запуске (до сертификата) оставьте только
# server на :80, получите cert через certbot, он сам добавит :443-блок.

upstream menugen_backend {
    server 127.0.0.1:8003;
}

# ── HTTP :80 — редирект на HTTPS (после выпуска cert) + ACME challenge ─────────
server {
    listen 80;
    listen [::]:80;
    server_name menugen.ru www.menugen.ru;

    # Для выпуска/продления сертификата Let's Encrypt (webroot-режим, если нужен).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name menugen.ru www.menugen.ru;

    # Эти строки допишет/переопределит certbot --nginx:
    # ssl_certificate     /etc/letsencrypt/live/menugen.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/menugen.ru/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # base64-загрузки фото (приготовленное блюдо, товары) идут в теле JSON.
    # Держим запас над DATA_UPLOAD_MAX_MEMORY_SIZE (15 МБ) в Django.
    client_max_body_size 20m;

    # ── API → Django backend ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://menugen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Django admin + его статика ────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://menugen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика Django (collectstatic → /app/staticfiles). Если смонтирован на хост
    # как /opt/menugen/backend/staticfiles — можно отдавать напрямую:
    #   location /static/ { alias /opt/menugen/backend/staticfiles/; }
    # По умолчанию проксируем в backend (runserver сам отдаёт статику при DEBUG,
    # для prod лучше alias — см. MIGRATION.md).
    location /static/ {
        alias /opt/menugen/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # ── Медиа (загруженные фото). Docker volume media_files смонтирован на хост. ─
    # Путь на хосте зависит от того, как смонтирован volume (см. MIGRATION.md).
    location /media/ {
        alias /opt/menugen/media/;
        access_log off;
        expires 7d;
    }

    # ── Веб-фронт (CRA build) — SPA fallback ──────────────────────────────────
    root /opt/menugen/web-dist;
    index index.html;

    # index.html не кэшируем (иначе пользователи застревают на старом бандле).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
