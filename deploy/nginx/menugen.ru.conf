# MenuGen — nginx для НОВОГО сервера (menugen.ru, один домен, HTTPS).
# Новый сервер выделен под MenuGen (чистая система), поэтому занимаем 80/443.
# Backend (docker) слушает только 127.0.0.1:8003 — наружу отдаёт этот прокси.
# Веб-фронт (CRA build) лежит в /opt/menugen/web-dist.
#
# Раскладка /static/ (важно — без коллизий):
#   • CRA кладёт свои ассеты в /static/js, /static/css, /static/media  → web-dist
#   • Django admin/DRF — в /static/admin/, /static/rest_framework/      → staticfiles
#     (после `collectstatic`; при DEBUG=False runserver статику сам не отдаёт).
# /media/  проксируем в backend (Django отдаёт файлы и при DEBUG=False — см. urls.py).
#
# Установка:
#   cp deploy/nginx/menugen.ru.conf /etc/nginx/sites-available/menugen.ru.conf
#   ln -sf /etc/nginx/sites-available/menugen.ru.conf /etc/nginx/sites-enabled/
#   # (до выпуска cert оставьте только server :80; certbot допишет :443)
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d menugen.ru -d www.menugen.ru

upstream menugen_backend {
    server 127.0.0.1:8003;
}

# ── HTTP :80 — ACME challenge + редирект на HTTPS ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name menugen.ru www.menugen.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name menugen.ru www.menugen.ru;

    # Строки ssl_certificate/… допишет certbot --nginx:
    # ssl_certificate     /etc/letsencrypt/live/menugen.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/menugen.ru/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # base64-загрузки фото (приготовленное блюдо, товары) в теле JSON.
    # Запас над DATA_UPLOAD_MAX_MEMORY_SIZE (15 МБ) в Django.
    client_max_body_size 20m;

    root /opt/menugen/web-dist;
    index index.html;

    # ── API → Django ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://menugen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Django admin ──────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://menugen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Медиа → Django (serve view, работает при DEBUG=False) ─────────────────
    location /media/ {
        proxy_pass http://menugen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Статика Django (admin/DRF) → collectstatic (bind-mount ./backend) ─────
    location /static/admin/ {
        alias /opt/menugen/backend/staticfiles/admin/;
        access_log off;
        expires 30d;
    }
    location /static/rest_framework/ {
        alias /opt/menugen/backend/staticfiles/rest_framework/;
        access_log off;
        expires 30d;
    }
    location /static/drf_spectacular_sidecar/ {
        alias /opt/menugen/backend/staticfiles/drf_spectacular_sidecar/;
        access_log off;
        expires 30d;
    }

    # ── APK для скачивания (как на старом сервере) ────────────────────────────
    location /apk/ {
        alias /opt/menugen/web-dist/apk/;
        autoindex on;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment';
    }

    # ── Веб-фронт (CRA): /static/ (js/css/media) + SPA fallback ───────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
