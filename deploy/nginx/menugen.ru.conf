# MenuGen — nginx для НОВОГО сервера (menugen.ru). HTTP :80 vhost.
# Certbot апгрейдит его до HTTPS сам: `certbot --nginx -d menugen.ru -d www.menugen.ru`
# добавит отдельный server{ listen 443 ssl } с сертификатом и редирект http→https.
# Поэтому здесь НЕТ блока :443 — иначе `nginx -t` падает до выпуска cert.
#
# Новый сервер выделен под MenuGen (чистая система) → занимаем 80/443.
# Backend (docker) слушает только 127.0.0.1:8003 — наружу отдаёт этот прокси.
# Веб-фронт (CRA build) — /opt/menugen/web-dist.
#
# Раскладка /static/ (без коллизий):
#   • CRA: /static/js, /static/css, /static/media          → web-dist
#   • Django admin/DRF: /static/admin/, /static/rest_framework/ → collectstatic
# /media/ проксируем в backend (Django отдаёт файлы и при DEBUG=False — см. urls.py).
#
# Установка:
#   cp deploy/nginx/menugen.ru.conf /etc/nginx/sites-available/menugen.ru.conf
#   ln -sf /etc/nginx/sites-available/menugen.ru.conf /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#   # после переключения DNS: certbot --nginx -d menugen.ru -d www.menugen.ru

upstream menugen_backend {
    server 127.0.0.1:8003;
}

server {
    listen 80;
    listen [::]:80;
    server_name menugen.ru www.menugen.ru;

    # base64-загрузки фото в теле JSON; запас над DATA_UPLOAD_MAX_MEMORY_SIZE (15 МБ).
    client_max_body_size 20m;

    root /opt/menugen/web-dist;
    index index.html;

    # ── API → Django ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://menugen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Django admin ──────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://menugen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Медиа → Django (serve view работает и при DEBUG=False) ────────────────
    location /media/ {
        proxy_pass http://menugen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Статика Django (admin/DRF) → collectstatic (bind-mount ./backend) ─────
    location /static/admin/ {
        alias /opt/menugen/backend/staticfiles/admin/;
        access_log off;
        expires 30d;
    }
    location /static/rest_framework/ {
        alias /opt/menugen/backend/staticfiles/rest_framework/;
        access_log off;
        expires 30d;
    }
    location /static/drf_spectacular_sidecar/ {
        alias /opt/menugen/backend/staticfiles/drf_spectacular_sidecar/;
        access_log off;
        expires 30d;
    }

    # ── APK для скачивания (как на старом сервере) ────────────────────────────
    location /apk/ {
        alias /opt/menugen/web-dist/apk/;
        autoindex on;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment';
    }

    # ── Веб-фронт (CRA): /static/ (js/css/media) + SPA fallback ───────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
