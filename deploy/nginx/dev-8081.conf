# Копия /etc/nginx/sites-available/menugen-debug с dev-сервера (31.192.110.121).
#
# Источник истины — файл на сервере; здесь копия, чтобы конфиги двух серверов
# можно было сравнить диффом. Поменяли на сервере — обновите копию.
# См. README.md рядом: там про раздел /static/ и как чинить админку без стилей.
server {
    listen 8081 default_server;
    server_name _;

    # MG_ADMINSTATIC: статика админки и DRF — из collectstatic.
    # Без этих правил /static/admin/... попадает в SPA-фолбэк (location /)
    # и отдаёт index.html фронта: браузер получает HTML вместо CSS,
    # и админка открывается совсем без стилей.
    location /static/admin/ {
        alias /opt/menugen/backend/staticfiles/admin/;
        access_log off;
        expires 30d;
    }
    location /static/rest_framework/ {
        alias /opt/menugen/backend/staticfiles/rest_framework/;
        access_log off;
        expires 30d;
    }
    location /static/drf_spectacular_sidecar/ {
        alias /opt/menugen/backend/staticfiles/drf_spectacular_sidecar/;
        access_log off;
        expires 30d;
    }

    root /opt/menugen/web-dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /media/ {
        # MG_DEVMIRROR: сначала спрашиваем свой бэкенд — файлы, загруженные во
        # время теста на dev, лежат только здесь. Нет у себя — берём с прода,
        # чтобы не копировать полтора гигабайта картинок.
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 = @prod_media;
    }

    location @prod_media {
        # Без переменной в proxy_pass: имя резолвится при старте, отдельный
        # resolver не нужен. Исходный URI подставляется как есть.
        proxy_pass https://menugen.ru;
        proxy_ssl_server_name on;
        proxy_set_header Host menugen.ru;
    }

    location /apk/ {
        alias /opt/menugen/web-dist/apk/;
        autoindex on;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment';
    }
}
